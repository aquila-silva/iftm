<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
    <meta name="author" content="Aquila Fernando Alves Silva">
    <link rel="icon" href="img/icon.webp">
    <title>Entre ou Cadastre-se</title>
</head>
<body>
    <div class="sideNav">
        <h2 id="tituloLogin"></h2>

        <img src="img/gatinhodefault.webp" id="icon">

        <p id="textoLogin"></p>

        <input type="" id="btnIcon" class="btnIcon">
        <p id="textIcon"></p>
        <input type="" id="btnSair" class="btnSair">

        <div>
            <h2>Lista de Usuarios Cadastrados:</h2>
            <input type="button" value="Limpar Cadastros" id="btnLimpar" class="btnLimpar">
            
            <div>
                <ul id="uList"></ul>
            </div>
        </div>
        
    </div>


    </nav>
    <div class="container">

        <div class="cadastro">
            <p>Ainda não possui uma conta?</p>
            <h2>Cadastre-se</h2>
            <form action="">
                <label for="">Login: </label>
                <input type="text" required id="username">
                <label for="">Senha: </label>
                <input type="password" required id="userPass">
                <input type="button" value="Cadastrar" id="btnCadastro">
                <p id="confirm"></p>
            </form>
        </div>

        <div class="login">
            <p>Já é cadastrado?</p>
            <h2>Entrar</h2>
            <form action="">
                <label for="">Login: </label>
                <input type="text" required id="userLogin">
                <label for="">Senha: </label>
                <input type="password" required id="userPassLogin">
                <input type="button" value="Entrar" id="btnLogin">
                <p id="confirmLogin"></p>
            </form>
        </div>

    </div>

    <div class="selecionaIcon" id="selecionaIcon">
        <h2>Escolha um Gatinho!</h2>
        <p>Selecione uma imagem de gatinho para ser seu icone de avatar.</p>
        <div>
            <img src="img/gatinho1.webp" alt="" id="icon0">
            <img src="img/gatinho2.webp" alt="" id="icon1">
        </div>

        <div>
            <img src="img/gatinho3.webp" alt="" id="icon2">
            <img src="img/gatinho4.webp" alt="" id="icon3">
        </div>

        <input type="button" value="Confirmar" id="btnConfirmIcon">
    </div>


</body>
</html>
