<html>
<head>
<title></title>
<script type="text/javascript">

nome = prompt("Qual o seu primeiro nome?");
sobrenome = prompt("Qual o seu sobrenome?")
cor = prompt("Em qual cor deseja que seu nome seja impresso?")
n = prompt("Quantas vezes deseja\nque seu nome seja impresso?")

for (i=1; i<=n; i++)
if (i%2 == 0)
    document.write(`<p style="color: ${cor} ;"> ${i} - ${nome} ${sobrenome}</p>`);
else
    document.write("<p>"+ i +" - "+ nome + " " + sobrenome +"</p>");
</script>
</head>

<body>

</body>

</html>
